<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Message Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #f1f5f9;
            display: none;
        }

        .spam {
            color: #dc2626;
            font-weight: bold;
        }

        .ham {
            color: #16a34a;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📩 Spam Message Checker</h1>

        <p class="description">
            Enter a message below to check whether it is spam or a normal message.
        </p>

        <textarea
            id="message"
            placeholder="Enter your message here..."
        ></textarea>

        <button onclick="checkMessage()">
            Check Message
        </button>

        <div id="result"></div>

    </div>


    <script>

        async function checkMessage() {

            const message = document
                .getElementById("message")
                .value
                .trim();

            const result = document
                .getElementById("result");


            if (!message) {

                result.style.display = "block";

                result.innerHTML =
                    '<p class="error">Please enter a message.</p>';

                return;
            }


            result.style.display = "block";

            result.innerHTML = "Checking message...";


            try {

                const response = await fetch(
                    "https://spam-classifier-latest-1.onrender.com/predict",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })
                    }
                );


                if (!response.ok) {
                    throw new Error("API request failed");
                }


                const data = await response.json();


                const prediction =
                    data.prediction;

                const probability =
                    (data.spam_probability * 100).toFixed(2);


                if (prediction === "spam") {

                    result.innerHTML = `
                        <h2 class="spam">🚨 SPAM</h2>

                        <p>
                            Spam probability:
                            <strong>${probability}%</strong>
                        </p>
                    `;

                } else {

                    result.innerHTML = `
                        <h2 class="ham">✅ HAM</h2>

                        <p>
                            Spam probability:
                            <strong>${probability}%</strong>
                        </p>
                    `;
                }


            } catch (error) {

                result.innerHTML = `
                    <p class="error">
                        Unable to connect to the spam classifier API.
                    </p>
                `;

                console.error(error);
            }
        }

    </script>

</body>
</html>
